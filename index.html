<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHADOW CORE 프로필 생성기</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b12;--panel:#171724;--line:#2c2c44;--tx:#e8e8f4;--sub:#9a9ab8;--ac:#8b5cf6;--ac2:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:18px;margin:4px 0 14px}
#card{width:100%;background:linear-gradient(160deg,#14102a,#0a0a14 60%,#0d1a24);border:2px solid var(--ac);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.title{font-family:Orbitron,Impact,sans-serif;font-weight:900;font-size:26px;letter-spacing:3px;text-align:center;color:#fff;text-shadow:0 0 12px var(--ac)}
.img{background:#1d1d30 center/cover no-repeat;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.main{height:260px;margin:12px 0}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nick{font-size:24px;font-weight:800}
.lv{background:var(--ac);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.job{color:var(--ac2);font-size:14px;margin-top:2px}
.lab{font-size:11px;letter-spacing:2px;color:var(--ac);font-weight:700;margin:14px 0 6px}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk .img{aspect-ratio:1}
.sk div.n{font-size:11px;text-align:center;margin-top:4px;min-height:14px;word-break:keep-all}
.pet{display:flex;gap:10px;align-items:center}
.pet .img{width:84px;height:84px;flex:none}
.pn{font-weight:700;font-size:14px}.pi{font-size:12px;color:var(--sub);white-space:pre-wrap}
.intro{background:#00000055;border-left:3px solid var(--ac2);padding:8px 10px;font-size:13px;border-radius:4px;min-height:32px}
.ng{border:1px solid #ef4444;color:#fca5a5;border-radius:6px;padding:8px 10px;font-size:13px;min-height:32px}
.ng b{color:#ef4444;margin-right:6px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.form h2{font-size:13px;margin:12px 0 6px;color:var(--sub)}.form h2:first-child{margin-top:0}
input[type=text],input[type=number],textarea{width:100%;background:#0e0e18;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font-size:15px;font-family:inherit;margin-bottom:6px}
textarea{resize:vertical;min-height:54px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.up{display:block;background:#0e0e18;border:1px dashed var(--ac);color:var(--ac);text-align:center;padding:9px;border-radius:8px;font-size:13px;margin-bottom:6px;cursor:pointer}
.up input{display:none}
button{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;margin-top:14px}
#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;z-index:9;overflow:auto}
#modal img{max-width:100%;max-height:78vh;border-radius:10px}
#modal p{color:#fff;font-size:14px;text-align:center}
#modal button{max-width:200px;background:#333}
</style></head><body><div class="wrap">
<h1>🌑 SHADOW CORE 프로필 생성기</h1>

<div id="card">
  <div class="title">SHADOW CORE</div>
  <div class="img main" id="mainImg">메인 이미지</div>
  <div class="row"><span class="nick" id="oNick">닉네임</span><span class="lv" id="oLv">Lv.1</span></div>
  <div class="job" id="oJob">직업</div>
  <div class="lab">SKILL</div>
  <div class="skills" id="skOut"></div>
  <div class="lab">PET</div>
  <div class="pet"><div class="img" id="petImg">PET</div><div><div class="pn" id="oPetN">펫 이름</div><div class="pi" id="oPetI">펫 정보</div></div></div>
  <div class="lab">ONE LINE</div>
  <div class="intro" id="oIntro">한줄 소개</div>
  <div class="lab">&nbsp;</div>
  <div class="ng"><b>NG</b><span id="oNg">-</span></div>
</div>

<div class="form">
  <h2>메인 이미지</h2>
  <label class="up">📷 이미지 선택<input type="file" accept="image/*" id="fMain"></label>
  <h2>기본 정보</h2>
  <input type="text" id="iNick" placeholder="닉네임" maxlength="20">
  <div class="g2"><input type="number" id="iLv" placeholder="레벨" min="1"><input type="text" id="iJob" placeholder="직업" maxlength="20"></div>
  <h2>스킬 (최대 4개)</h2>
  <div class="g4" id="skForm"></div>
  <h2>펫 (이미지 1장)</h2>
  <label class="up">📷 펫 이미지 선택<input type="file" accept="image/*" id="fPet"></label>
  <input type="text" id="iPetN" placeholder="펫 이름" maxlength="20">
  <textarea id="iPetI" placeholder="펫 정보 (종류, 성격 등)"></textarea>
  <h2>한줄 소개</h2>
  <input type="text" id="iIntro" placeholder="한줄 소개" maxlength="60">
  <h2>NG</h2>
  <input type="text" id="iNg" placeholder="NG 항목 (예: 파국, 사이퍼 등)" maxlength="80">
  <button id="make">🖼 이미지로 만들기</button>
</div></div>

<div id="modal"><p>이미지를 길게 눌러 저장하세요</p><img id="out" alt="프로필"><button id="close">닫기</button></div>

<script>
const $=id=>document.getElementById(id);
const setImg=(el,file)=>{if(!file)return;const r=new FileReader();r.onload=()=>{el.style.backgroundImage='url('+r.result+')';el.textContent=''};r.readAsDataURL(file)};
const bind=(i,o,fmt)=>{$(i).addEventListener('input',()=>{$(o).textContent=fmt?fmt($(i).value):$(i).value})};
bind('iNick','oNick',v=>v||'닉네임');
bind('iLv','oLv',v=>'Lv.'+(v||1));
bind('iJob','oJob',v=>v||'직업');
bind('iPetN','oPetN',v=>v||'펫 이름');
bind('iPetI','oPetI',v=>v||'펫 정보');
bind('iIntro','oIntro',v=>v||'한줄 소개');
bind('iNg','oNg',v=>v||'-');
$('fMain').onchange=e=>setImg($('mainImg'),e.target.files[0]);
$('fPet').onchange=e=>setImg($('petImg'),e.target.files[0]);
for(let i=0;i<4;i++){
  $('skForm').insertAdjacentHTML('beforeend',`<div><label class="up">📷 스킬 ${i+1}<input type="file" accept="image/*" id="fs${i}"></label><input type="text" id="is${i}" placeholder="스킬 ${i+1} 이름" maxlength="12"></div>`);
  $('skOut').insertAdjacentHTML('beforeend',`<div class="sk"><div class="img" id="os${i}">${i+1}</div><div class="n" id="on${i}"></div></div>`);
  $('fs'+i).onchange=e=>setImg($('os'+i),e.target.files[0]);
  $('is'+i).oninput=e=>{$('on'+i).textContent=e.target.value};
}
$('make').onclick=async()=>{
  const b=$('make');b.textContent='만드는 중...';
  try{
    await (document.fonts&&document.fonts.ready);
    const c=await html2canvas($('card'),{scale:2,backgroundColor:'#0a0a14',useCORS:true});
    $('out').src=c.toDataURL('image/png');$('modal').style.display='flex';
  }catch(err){alert('이미지 생성에 실패했어요. 화면 캡처를 이용해 주세요.')}
  b.textContent='🖼 이미지로 만들기';
};
$('close').onclick=()=>{$('modal').style.display='none'};
</script></body></html>
